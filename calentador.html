<style>

  --seal-c: #10b981;
}
@media (prefers-color-scheme: dark) {

    --accent-bg: #1e293b;
    --accent-border: #1e3a5f;
    --ext-c: #a78bfa;
    --ext-bg: #1e1b33;
    --cong-c: #60a5fa;
    --cong-bg: #1e293b;
    --refri-c: #34d399;
    --refri-bg: #1a2e28;
    --sist-c: #fb923c;
    --sist-bg: #2a1f14;
    --seal-c: #34d399;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1419;
  --bg-card: #1a2332;
  --fg: #e8edf2;
  --fg2: #94a3b8;

}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  padding: 16px;
  max-width: 720px;
  margin: 0 auto;
}
.header {
  text-align: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--fg);
  margin-bottom: 4px;
}
.header p {
  font-size: 13px;
  color: var(--fg3);
}
.logo-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent-bg);
  border: 1px solid var(--accent-border);
  border-radius: 20px;
  padding: 4px 14px 4px 8px;
  margin-bottom: 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
}
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.tab {
  flex: 1;
  min-width: 70px;
  padding: 8px 6px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  color: var(--fg2);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  font-family: inherit;
}
.tab:hover { border-color: var(--border-h); }
.tab.on[data-k="e"] { background: var(--ext-bg); border-color: var(--ext-c); color: var(--ext-c); }
.tab.on[data-k="c"] { background: var(--cong-bg); border-color: var(--cong-c); color: var(--cong-c); }
.tab.on[data-k="r"] { background: var(--refri-bg); border-color: var(--refri-c); color: var(--refri-c); }
.tab.on[data-k="s"] { background: var(--sist-bg); border-color: var(--sist-c); color: var(--sist-c); }
.diagram { width: 100%; max-width: 520px; margin: 0 auto 20px auto; }
.cards { display: flex; flex-direction: column; gap: 6px; }
.card {
  padding: 12px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  transition: all 0.15s;
}
.card:hover, .card.on { border-color: var(--accent); background: var(--accent-bg); }
.card-head { display: flex; align-items: center; gap: 10px; }
.badge {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.card-title { font-size: 14px; font-weight: 600; color: var(--fg); }
.card-desc {
  font-size: 12.5px;
  color: var(--fg2);
  margin-top: 6px;
  padding-left: 36px;
  line-height: 1.55;
}
.mg { cursor: pointer; transition: opacity 0.2s; }
.mg.dim { opacity: 0.1; }
.mg.glow circle.mk { filter: drop-shadow(0 0 8px currentColor); }
.count-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--fg3);
  margin-top: 8px;
}
</style>

<div class="cards" id="cards"></div>

<script>
const D={
e:{l:'Exterior',c:'var(--ext-c)',p:[
{n:1,t:'Carcasa frontal',d:'Cubierta metalica exterior del equipo, generalmente de acero galvanizado o laminado en frio con pintura electrostatica. Protege los componentes internos del agua y polvo. Si presenta corrosion: lijar, aplicar anticorrosivo y pintura termica. Verificar que las rejillas de ventilacion no esten obstruidas.'},
{n:2,t:'Panel de control / display',d:'Pantalla LCD o LED que muestra la temperatura del agua, codigo de error y estado de operacion. En modelos digitales tiene botones tactiles para ajuste de temperatura (35-60°C). Si no enciende: verificar alimentacion 120V/pilas y fusible de la tarjeta. Codigos de error comunes: E1 (sin ignicion), E2 (sobrecalentamiento), E4 (falta de llama).'},
{n:3,t:'Perillas de regulacion',d:'Controles rotativos para ajustar flujo de gas y caudal de agua. La perilla de gas regula la potencia del quemador (baja/media/alta). La de agua controla el volumen de paso. Si gotea por el eje: cambiar o-ring interno. Si gira sin tope: resorte de retencion roto. Posicion "piloto" en modelos con llama permanente.'},
{n:4,t:'Ducto de evacuacion de gases',d:'Tubo de aluminio o acero inoxidable (diametro 80-110mm) que expulsa gases de combustion (CO, CO2, vapor) al exterior. NUNCA debe descargar dentro de la vivienda. Longitud maxima: 3m con maximo 2 codos de 90°. Verificar que no haya obstrucciones (nidos, sarro). Pendiente minima: 3% ascendente hacia la salida.'},
{n:5,t:'Cubierta inferior',d:'Tapa inferior removible que cubre las conexiones de agua fria, caliente y gas. Permite acceso a valvulas y tuberias para mantenimiento. Se retira con 2-4 tornillos o clips. Verificar que los empaques de las conexiones no tengan fugas. En modelos tipo balcon, protege del viento la llama piloto.'}
]},
c:{l:'Sist. hidraulico',c:'var(--cong-c)',p:[
{n:6,t:'Entrada de agua fria',d:'Conexion inferior izquierda (generalmente marcada con anillo azul). Rosca de 1/2" NPT o BSP. Presion de trabajo: 0.5-8 bar (7-116 PSI). Si la presion es menor a 0.3 bar el equipo no enciende. Instalar llave de paso y filtro tipo Y antes de la entrada para atrapar sedimentos. Verificar que la manguera flexible no este doblada.'},
{n:7,t:'Salida de agua caliente',d:'Conexion inferior derecha (marcada con anillo rojo). Misma rosca 1/2". Temperatura de salida: 35-60°C segun ajuste. Si el agua sale tibia: caudal excesivo, quemador sucio o intercambiador con sarro. Caudal tipico: 6-16 litros/minuto segun modelo. No usar cinta teflon en exceso para evitar obstruccion.'},
{n:8,t:'Cuerpo de agua (membrana)',d:'Diafragma de caucho o silicona dentro de la caja de agua que detecta el paso de flujo. Al abrirse la llave, la presion deforma la membrana y activa la valvula de gas. Vida util: 3-5 anos. Si no enciende al abrir agua: membrana rota, perforada o endurecida. Repuesto economico pero critico. Verificar que no tenga depositos de cal.'},
{n:9,t:'Venturi (sensor de flujo)',d:'Tubo estrecho que acelera el agua para crear diferencial de presion y activar el encendido. Caudal minimo de activacion: 2-3 L/min. Si no enciende con poca presion: limpiar el venturi con vinagre para remover sarro. Algunos modelos usan sensor de efecto Hall (electronico) en vez de venturi mecanico.'},
{n:10,t:'Valvula de agua',d:'Controla el paso de agua y la modulacion de flujo. Conectada mecanicamente con la membrana. Si gotea: sellos internos desgastados. Si no corta el agua al cerrar la llave: resorte de retorno debil o eje trabado. En modelos electronicos, es un servomotor que regula caudal segun temperatura deseada.'}
]},
r:{l:'Sist. gas',c:'var(--refri-c)',p:[
{n:11,t:'Entrada de gas',d:'Conexion inferior (marcada en amarillo). Rosca 1/2" con llave de paso externa obligatoria. Presion de gas natural: 18-22 mbar. Gas propano (GLP): 28-37 mbar. SIEMPRE verificar con manometro antes de encender. Si hay olor a gas: cerrar llave, ventilar y buscar fuga con agua jabonosa (NUNCA con llama). Verificar que el tipo de gas coincida con la calibracion del equipo.'},
{n:12,t:'Valvula de gas principal',d:'Solenoide electromagnetica que abre/cierra el suministro de gas al quemador. Voltaje: 3VDC (pilas) o 120VAC segun modelo. Si no abre: verificar alimentacion con multimetro, bobina debe tener 3-15 ohmios. Si se queda abierta (peligroso): reemplazar inmediatamente. En modelos modulantes, tiene motor paso a paso para regular potencia.'},
{n:13,t:'Quemador principal',d:'Barra o conjunto de tubos perforados donde se mezcla gas con aire y se produce la combustion. Llama azul = combustion correcta. Llama amarilla/naranja = falta aire o quemador sucio. Potencia: 12,000-40,000 BTU segun modelo. Limpiar orificios con cepillo de bronce y aire comprimido cada 6-12 meses. Si se tapa: produce CO peligroso.'},
{n:14,t:'Quemador piloto / encendido electronico',d:'Modelos con piloto: llama pequeña permanente que enciende el quemador principal. Consume ~500 BTU/h. Si se apaga frecuentemente: termopar desgastado o corriente de aire. Modelos con encendido electronico: generan chispa solo al detectar flujo de agua. Mas eficientes. Usan pilas 1.5V (2xD) o hidrogenador. Si no produce chispa: pilas agotadas o electrodo sucio.'},
{n:15,t:'Electrodo de ignicion / ionizacion',d:'Pieza ceramica con punta metalica. Genera chispa de alto voltaje (10-15kV) para encender el gas. El mismo electrodo o uno separado detecta la llama por ionizacion (microamperios). Si no enciende: limpiar punta con lija fina 400, gap correcto 3-4mm. Si enciende pero se apaga: electrodo de ionizacion sucio o cable de alta tension danado. Verificar aislamiento ceramico sin fisuras.'}
]},
s:{l:'Seguridad',c:'var(--sist-c)',p:[
{n:16,t:'Sensor de temperatura (termistor)',d:'Sensor NTC montado en la salida del intercambiador. Mide temperatura del agua en tiempo real. Resistencia tipica: 50kΩ a 25°C, baja a ~5kΩ a 80°C. Si el agua sale demasiado caliente o fria sin razon: medir con multimetro y comparar tabla del fabricante. Si esta abierto o en corto: la tarjeta muestra error E2/E3 y bloquea el equipo.'},
{n:17,t:'Sensor de llama',d:'Varilla metalica dentro de la llama que detecta ionizacion. Corriente normal: 1-3 microamperios. Si la llama existe pero el sensor no la detecta: limpiar con lija fina y verificar conexion a masa (tierra). Si la corriente es <0.5µA, la tarjeta corta el gas por seguridad en 5-10 segundos. En modelos con piloto: se usa termopar (genera 20-30mV por calor).'},
{n:18,t:'Valvula de seguridad por sobrecalentamiento',d:'Interruptor bimetalico o fusible termico que corta el gas si la temperatura supera 90-95°C. Protege contra explosion o deformacion del intercambiador. Si se dispara frecuentemente: intercambiador con sarro (reduce transferencia termica), flujo de agua muy bajo, o gas mal regulado. Algunos son rearmables (boton reset), otros son fusibles de un solo uso (reemplazar).'},
{n:19,t:'Interruptor de flujo de aire (presostato)',d:'Sensor de presion diferencial que verifica la correcta evacuacion de gases. Conectado al ducto de salida mediante manguera. Si no hay tiro suficiente: bloquea el encendido (seguridad anti-CO). Presion de activacion: 1-3 Pa. Si el equipo no enciende y el presostato no cierra: ducto obstruido, ventilador de tiro forzado fallando, o manguera del sensor desconectada/rota.'},
{n:20,t:'Tarjeta electronica de control',d:'PCB principal que coordina encendido, modulacion de llama, lectura de sensores y protecciones. Alimentacion: pilas (3VDC) o 120VAC. Si muestra codigos de error: consultar manual del modelo especifico. Fallas comunes: triac quemado (no enciende chispa), relay pegado (gas no abre), capacitor hinchado. No reparar si hay quemaduras visibles en la placa. Proteger de humedad con spray dielelectrico.'}
]}
};
const K=['e','c','r','s'];
let cur='e';
function init(){
document.getElementById('tb').innerHTML=K.map(k=>'<button class="tab'+(k===cur?' on':'')+'" data-k="'+k+'" onclick="sh(\''+k+'\')">'+D[k].l+'</button>').join('');
sh('e');
}
function sh(k){
cur=k;
document.querySelectorAll('.tab').forEach((b,i)=>{b.classList.toggle('on',K[i]===k)});
const c=document.getElementById('cards');
const s=D[k];
c.innerHTML=s.p.map((p,i)=>'<div class="card" ontouchstart="hi(\''+k+'\','+i+')" ontouchend="lo()" onmouseenter="hi(\''+k+'\','+i+')" onmouseleave="lo()"><div class="card-head"><span class="badge" style="background:'+s.c+'">'+p.n+'</span><span class="card-title">'+p.t+'</span></div><div class="card-desc">'+p.d+'</div></div>').join('');
lo();
}
function hi(k,i){
document.querySelectorAll('.mg').forEach(g=>{
if(g.dataset.s===k&&parseInt(g.dataset.i)===i){g.classList.remove('dim');g.classList.add('glow');}
else{g.classList.add('dim');g.classList.remove('glow');}
});
}
function lo(){
document.querySelectorAll('.mg').forEach(g=>{
if(g.dataset.s===cur){g.classList.remove('dim');g.classList.remove('glow');}
else{g.classList.add('dim');g.classList.remove('glow');}
});
}
init();
</script>
