<title>Lavadora Carga Superior - Partes y Componentes</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafb;
  --bg-card: #ffffff;
  --fg: #1a2332;
  --fg2: #4a5568;
  --fg3: #8494a7;
  --border: #e2e8f0;
  --border-h: #cbd5e1;
  --accent: #2563eb;
  --accent-bg: #eff6ff;
  --accent-border: #bfdbfe;
  --ext-c: #7c3aed;
  --ext-bg: #f5f3ff;
  --lav-c: #2563eb;
  --lav-bg: #eff6ff;
  --hid-c: #059669;
  --hid-bg: #ecfdf5;
  --mot-c: #ea580c;
  --mot-bg: #fff7ed;
  --seal-c: #10b981;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1419;
    --bg-card: #1a2332;
    --fg: #e8edf2;
    --fg2: #94a3b8;
    --fg3: #64748b;
    --border: #2d3a4a;
    --border-h: #3d4f63;
    --accent: #60a5fa;
    --accent-bg: #1e293b;
    --accent-border: #1e3a5f;
    --ext-c: #a78bfa;
    --ext-bg: #1e1b33;
    --lav-c: #60a5fa;
    --lav-bg: #1e293b;
    --hid-c: #34d399;
    --hid-bg: #1a2e28;
    --mot-c: #fb923c;
    --mot-bg: #2a1f14;
    --seal-c: #34d399;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1419;
  --bg-card: #1a2332;
  --fg: #e8edf2;
  --fg2: #94a3b8;
  --fg3: #64748b;
  --border: #2d3a4a;
  --border-h: #3d4f63;
  --accent: #60a5fa;
  --accent-bg: #1e293b;
  --accent-border: #1e3a5f;
  --ext-c: #a78bfa;
  --ext-bg: #1e1b33;
  --lav-c: #60a5fa;
  --lav-bg: #1e293b;
  --hid-c: #34d399;
  --hid-bg: #1a2e28;
  --mot-c: #fb923c;
  --mot-bg: #2a1f14;
  --seal-c: #34d399;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  padding: 16px;
  max-width: 720px;
  margin: 0 auto;
}
.header {
  text-align: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--fg);
  margin-bottom: 4px;
}
.header p {
  font-size: 13px;
  color: var(--fg3);
}
.logo-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent-bg);
  border: 1px solid var(--accent-border);
  border-radius: 20px;
  padding: 4px 14px 4px 8px;
  margin-bottom: 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
}
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.tab {
  flex: 1;
  min-width: 70px;
  padding: 8px 6px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  color: var(--fg2);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  font-family: inherit;
}
.tab:hover { border-color: var(--border-h); }
.tab.on[data-k="e"] { background: var(--ext-bg); border-color: var(--ext-c); color: var(--ext-c); }
.tab.on[data-k="l"] { background: var(--lav-bg); border-color: var(--lav-c); color: var(--lav-c); }
.tab.on[data-k="h"] { background: var(--hid-bg); border-color: var(--hid-c); color: var(--hid-c); }
.tab.on[data-k="m"] { background: var(--mot-bg); border-color: var(--mot-c); color: var(--mot-c); }
.diagram { width: 100%; max-width: 520px; margin: 0 auto 20px auto; }
.cards { display: flex; flex-direction: column; gap: 6px; }
.card {
  padding: 12px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  transition: all 0.15s;
}
.card:hover, .card.on { border-color: var(--accent); background: var(--accent-bg); }
.card-head { display: flex; align-items: center; gap: 10px; }
.badge {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.card-title { font-size: 14px; font-weight: 600; color: var(--fg); }
.card-desc {
  font-size: 12.5px;
  color: var(--fg2);
  margin-top: 6px;
  padding-left: 36px;
  line-height: 1.55;
}
.mg { cursor: pointer; transition: opacity 0.2s; }
.mg.dim { opacity: 0.1; }
.mg.glow circle.mk { filter: drop-shadow(0 0 8px currentColor); }
.count-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--fg3);
  margin-top: 8px;
}
.nav-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 20px;
  padding: 10px 16px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  color: var(--accent);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.15s;
}
.nav-link:hover { border-color: var(--accent); background: var(--accent-bg); }
</style>
</head>

<script>
const S=[
{k:'e',t:'Exterior',c:'var(--ext-c)',items:[
{n:'Tapa superior',d:'Cubierta abatible que da acceso al tambor. Incluye bisagra y seguro que detiene el ciclo al abrirla (switch de seguridad). Protege de salpicaduras durante el lavado.'},
{n:'Panel de control',d:'Contiene las perillas de seleccion de ciclo y temperatura, botones de inicio/pausa e indicadores LED. Es el centro de mando de la lavadora; controla tiempos, velocidades y nivel de agua.'},
{n:'Carcasa exterior',d:'Estructura metalica que protege todos los componentes internos. Fabricada en lamina galvanizada con pintura anticorrosiva. Soporta vibraciones del centrifugado.'},
{n:'Patas niveladoras',d:'Cuatro patas ajustables en la base que permiten nivelar la lavadora en superficies irregulares. Una lavadora desnivelada vibra excesivamente y puede desplazarse durante el centrifugado.'},
{n:'Tapa posterior de servicio',d:'Panel trasero removible que da acceso a la valvula de entrada, mangueras y conexiones electricas para mantenimiento y reparacion tecnica.'}
]},
{k:'l',t:'Sistema de lavado',c:'var(--lav-c)',items:[
{n:'Agitador',d:'Pieza central con aspas que gira alternadamente para crear turbulencia en el agua y frotar la ropa. Es el componente principal del lavado. Se conecta al eje de la transmision.'},
{n:'Canasta interior (tambor)',d:'Cilindro perforado de acero inoxidable donde se coloca la ropa. Los orificios permiten el paso del agua y durante el centrifugado expulsan el agua de la ropa por fuerza centrifuga.'},
{n:'Tina exterior',d:'Recipiente hermetico que rodea la canasta interior y contiene el agua durante el ciclo de lavado. No tiene perforaciones. Esta suspendida por resortes y amortiguadores para absorber vibraciones.'},
{n:'Filtro de pelusa',d:'Malla o trampa ubicada dentro del tambor que atrapa fibras, pelusas e hilos sueltos de la ropa durante el lavado. Debe limpiarse regularmente para evitar obstrucciones en el drenaje.'},
{n:'Dispensador de detergente',d:'Compartimento en la parte superior del tambor donde se deposita el detergente, suavizante y blanqueador. Libera los productos en el momento adecuado del ciclo de lavado.'}
]},
{k:'h',t:'Sistema hidraulico',c:'var(--hid-c)',items:[
{n:'Valvula de entrada de agua',d:'Electrovalvula que controla el ingreso de agua fria y caliente a la tina. Se abre electricamente segun la seleccion de temperatura. Tiene filtros de malla que evitan el paso de sedimentos.'},
{n:'Bomba de drenaje',d:'Motor con impulsor que expulsa el agua sucia de la tina al desague. Funciona durante el vaciado y centrifugado. Fallas comunes: obstruccion por monedas, botones u objetos pequeños.'},
{n:'Mangueras de entrada',d:'Dos mangueras (agua fria y caliente) que conectan la lavadora a las llaves de suministro. Llevan filtro de malla en los extremos. Deben revisarse periodicamente para evitar fugas o reventones.'},
{n:'Manguera de drenaje',d:'Tubo corrugado flexible que conduce el agua sucia desde la bomba hasta el desague o lavadero. Debe instalarse a una altura entre 60 y 90 cm para un sifon adecuado que evite retorno de agua.'},
{n:'Presostato (sensor de nivel)',d:'Sensor de presion de aire conectado a la tina mediante una manguerita. Detecta el nivel de agua y envia la señal a la tarjeta electronica para cerrar la valvula cuando el nivel es correcto.'}
]},
{k:'m',t:'Motor y transmision',c:'var(--mot-c)',items:[
{n:'Motor electrico',d:'Motor que genera la fuerza para girar el agitador y la canasta. Tiene dos velocidades: baja para agitacion y alta para centrifugado. Puede ser de induccion o de acoplamiento directo segun el modelo.'},
{n:'Correa de transmision',d:'Banda de caucho que transfiere el movimiento del motor a la polea de la transmision. Con el uso se estira y desgasta, causando deslizamiento y ruido. Debe reemplazarse cuando presenta grietas o se afloja.'},
{n:'Embrague',d:'Mecanismo que acopla y desacopla el motor de la transmision. Permite la transicion suave entre lavado y centrifugado. Su desgaste causa que la lavadora no centrifugue o lo haga debilmente.'},
{n:'Transmision (caja reductora)',d:'Conjunto de engranajes que convierte el giro continuo del motor en movimiento oscilante del agitador (lavado) y giro directo de la canasta (centrifugado). Es el componente mecanico mas complejo.'},
{n:'Amortiguadores y resortes',d:'Sistema de suspension que absorbe las vibraciones de la tina durante el centrifugado. Los resortes superiores sostienen la tina y los amortiguadores inferiores controlan el movimiento. Su falla causa golpeteo excesivo.'}
]}
];
let tab='e',hi=null;
const $=s=>document.getElementById(s);
function render(){
  let h='';S.forEach(s=>{h+=`<button class="tab${s.k===tab?' on':''}" data-k="${s.k}">${s.t}</button>`;});
  $('tb').innerHTML=h;
  const sec=S.find(s=>s.k===tab);
  let c='';sec.items.forEach((it,i)=>{
    c+=`<div class="card${hi===i?' on':''}" data-i="${i}" ontouchstart="hl(${i})" ontouchend="hl(null)"><div class="card-head"><div class="badge" style="background:${sec.c}">${tab==='e'?i+1:tab==='l'?i+6:tab==='h'?i+11:i+16}</div><span class="card-title">${it.n}</span></div><div class="card-desc">${it.d}</div></div>`;
  });
  $('cd').innerHTML=c;
  document.querySelectorAll('.mg').forEach(g=>{
    const s=g.dataset.s,i=+g.dataset.i;
    g.classList.toggle('dim',s===tab&&hi!==null&&i!==hi);
    g.classList.toggle('glow',s===tab&&hi===i);
    g.style.display=s===tab?'':'none';
  });
}
function hl(i){hi=i;render();}
$('tb').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){tab=b.dataset.k;hi=null;render();}});
$('cd').addEventListener('mouseenter',e=>{const c=e.target.closest('.card');if(c)hl(+c.dataset.i);},true);
$('cd').addEventListener('mouseleave',e=>{if(e.target.closest('.card'))hl(null);},true);
document.querySelectorAll('.mg').forEach(g=>{
  g.addEventListener('mouseenter',()=>{tab=g.dataset.s;hl(+g.dataset.i);});
  g.addEventListener('mouseleave',()=>hl(null));
  g.addEventListener('click',()=>{tab=g.dataset.s;hl(+g.dataset.i);});
});
render();
</script>
