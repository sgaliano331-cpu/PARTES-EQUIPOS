<style>
:root {
  --bg: #f8fafb;
  --bg-card: #ffffff;
  --fg: #1a2332;
  --fg2: #4a5568;
  --fg3: #8494a7;
  --border: #e2e8f0;
  --border-h: #cbd5e1;
  --accent: #2563eb;
  --accent-bg: #eff6ff;
  --accent-border: #bfdbfe;
  --ext-c: #7c3aed;
  --ext-bg: #f5f3ff;
  --cong-c: #2563eb;
  --cong-bg: #eff6ff;
  --refri-c: #059669;
  --refri-bg: #ecfdf5;
  --sist-c: #ea580c;
  --sist-bg: #fff7ed;
  --seal-c: #10b981;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1419;
    --bg-card: #1a2332;
    --fg: #e8edf2;
    --fg2: #94a3b8;
    --fg3: #64748b;
    --border: #2d3a4a;
    --border-h: #3d4f63;
    --accent: #60a5fa;
    --accent-bg: #1e293b;
    --accent-border: #1e3a5f;
    --ext-c: #a78bfa;
    --ext-bg: #1e1b33;
    --cong-c: #60a5fa;
    --cong-bg: #1e293b;
    --refri-c: #34d399;
    --refri-bg: #1a2e28;
    --sist-c: #fb923c;
    --sist-bg: #2a1f14;
    --seal-c: #34d399;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1419;
  --bg-card: #1a2332;
  --fg: #e8edf2;
  --fg2: #94a3b8;
  --fg3: #64748b;
  --border: #2d3a4a;
  --border-h: #3d4f63;
  --accent: #60a5fa;
  --accent-bg: #1e293b;
  --accent-border: #1e3a5f;
  --ext-c: #a78bfa;
  --ext-bg: #1e1b33;
  --cong-c: #60a5fa;
  --cong-bg: #1e293b;
  --refri-c: #34d399;
  --refri-bg: #1a2e28;
  --sist-c: #fb923c;
  --sist-bg: #2a1f14;
  --seal-c: #34d399;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  padding: 16px;
  max-width: 720px;
  margin: 0 auto;
}
.header {
  text-align: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--fg);
  margin-bottom: 4px;
}
.header p {
  font-size: 13px;
  color: var(--fg3);
}
.logo-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent-bg);
  border: 1px solid var(--accent-border);
  border-radius: 20px;
  padding: 4px 14px 4px 8px;
  margin-bottom: 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
}
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.tab {
  flex: 1;
  min-width: 70px;
  padding: 8px 6px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  color: var(--fg2);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  font-family: inherit;
}
.tab:hover { border-color: var(--border-h); }
.tab.on[data-k="e"] { background: var(--ext-bg); border-color: var(--ext-c); color: var(--ext-c); }
.tab.on[data-k="c"] { background: var(--cong-bg); border-color: var(--cong-c); color: var(--cong-c); }
.tab.on[data-k="r"] { background: var(--refri-bg); border-color: var(--refri-c); color: var(--refri-c); }
.tab.on[data-k="s"] { background: var(--sist-bg); border-color: var(--sist-c); color: var(--sist-c); }
.diagram { width: 100%; max-width: 520px; margin: 0 auto 20px auto; }
.cards { display: flex; flex-direction: column; gap: 6px; }
.card {
  padding: 12px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  transition: all 0.15s;
}
.card:hover, .card.on { border-color: var(--accent); background: var(--accent-bg); }
.card-head { display: flex; align-items: center; gap: 10px; }
.badge {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.card-title { font-size: 14px; font-weight: 600; color: var(--fg); }
.card-desc {
  font-size: 12.5px;
  color: var(--fg2);
  margin-top: 6px;
  padding-left: 36px;
  line-height: 1.55;
}
.mg { cursor: pointer; transition: opacity 0.2s; }
.mg.dim { opacity: 0.1; }
.mg.glow circle.mk { filter: drop-shadow(0 0 8px currentColor); }
.count-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--fg3);
  margin-top: 8px;
}
</style>
</head>

{n:11,t:'Luz LED interior',d:'Ilumina al abrir la puerta. Activada por door switch. Si no enciende: medir continuidad del switch con multimetro y verificar modulo LED.'},
{n:12,t:'Parrillas vidrio templado',d:'Soportan 15-20 kg. No bloquear las rejillas de ventilacion traseras del compartimento para mantener circulacion de aire.'},
{n:13,t:'Anaqueles de la puerta',d:'Estantes para botellas y condimentos. Zona mas caliente (8-10°C) por apertura frecuente. No guardar lacteos ni carnes.'},
{n:14,t:'Cajones crisper (verduras)',d:'Gavetas con regulador de humedad. Cerrado = alta humedad (verduras hoja). Abierto = baja humedad (frutas). Temp ideal: 2-4°C.'},
{n:15,t:'Damper / ventilador',d:'Compuerta motorizada que regula aire frio desde el congelador al refri. Si no enfria abajo pero arriba si: damper cerrado o motor del ventilador fallando.'}
]},
s:{l:'Sistema de frio',c:'var(--sist-c)',p:[
{n:16,t:'Compresor hermetico',d:'Motor sellado que comprime gas refrigerante (R134a/R600a). 100-250W. Si hace click y no arranca: revisar relay y protector termico. Medir bobinas con multimetro (comun, arranque, marcha).'},
{n:17,t:'Relay + protector termico',d:'Relay PTC arranca el compresor. Protector bimetalico lo apaga si sobrecalienta (>130°C). Si la nevera hace click cada 3-5 min: estos son los primeros sospechosos. Se cambian juntos.'},
{n:18,t:'Condensador (serpentin)',d:'Tuberia negra trasera/inferior donde el gas se enfria y vuelve liquido. Si esta sucio la nevera no enfria. Limpiar con cepillo cada 6 meses. Temp salida normal: 45-55°C.'},
{n:19,t:'Ventilador condensador',d:'Fuerza aire sobre el condensador inferior. Si falla, el compresor se sobrecalienta y el protector lo apaga repetidamente. Solo en modelos con condensador oculto.'},
{n:20,t:'Bandeja de drenaje',d:'Recoge agua del descongelamiento. Se evapora con calor del compresor. Si huele mal: limpiar con agua y vinagre. Si derrama: manguera de drenaje tapada.'}
]}
};
const K=['e','c','r','s'];
let cur='e';
function init(){
document.getElementById('tb').innerHTML=K.map(k=>'<button class="tab'+(k===cur?' on':'')+'" data-k="'+k+'" onclick="sh(\''+k+'\')">'+D[k].l+'</button>').join('');
sh('e');
}
function sh(k){
cur=k;
document.querySelectorAll('.tab').forEach((b,i)=>{b.classList.toggle('on',K[i]===k)});
const c=document.getElementById('cards');
const s=D[k];
c.innerHTML=s.p.map((p,i)=>'<div class="card" ontouchstart="hi(\''+k+'\','+i+')" ontouchend="lo()" onmouseenter="hi(\''+k+'\','+i+')" onmouseleave="lo()"><div class="card-head"><span class="badge" style="background:'+s.c+'">'+p.n+'</span><span class="card-title">'+p.t+'</span></div><div class="card-desc">'+p.d+'</div></div>').join('');
lo();
}
function hi(k,i){
document.querySelectorAll('.mg').forEach(g=>{
if(g.dataset.s===k&&parseInt(g.dataset.i)===i){g.classList.remove('dim');g.classList.add('glow');}
else{g.classList.add('dim');g.classList.remove('glow');}
});
}
function lo(){
document.querySelectorAll('.mg').forEach(g=>{
if(g.dataset.s===cur){g.classList.remove('dim');g.classList.remove('glow');}
else{g.classList.add('dim');g.classList.remove('glow');}
});
}
init();
</script>
