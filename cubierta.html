<style>
:root {
  --bg: #f8fafb;
  --bg-card: #ffffff;
  --fg: #1a2332;
  --fg2: #4a5568;
  --fg3: #8494a7;
  --border: #e2e8f0;
  --border-h: #cbd5e1;
  --accent: #2563eb;
  --accent-bg: #eff6ff;
  --accent-border: #bfdbfe;
  --ext-c: #7c3aed;
  --ext-bg: #f5f3ff;
  --cong-c: #2563eb;
  --cong-bg: #eff6ff;
  --refri-c: #059669;
  --refri-bg: #ecfdf5;
  --sist-c: #ea580c;
  --sist-bg: #fff7ed;
  --seal-c: #10b981;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1419;
    --bg-card: #1a2332;
    --fg: #e8edf2;
    --fg2: #94a3b8;
    --fg3: #64748b;
    --border: #2d3a4a;
    --border-h: #3d4f63;
    --accent: #60a5fa;
    --accent-bg: #1e293b;
    --accent-border: #1e3a5f;
    --ext-c: #a78bfa;
    --ext-bg: #1e1b33;
    --cong-c: #60a5fa;
    --cong-bg: #1e293b;
    --refri-c: #34d399;
    --refri-bg: #1a2e28;
    --sist-c: #fb923c;
    --sist-bg: #2a1f14;
    --seal-c: #34d399;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1419;
  --bg-card: #1a2332;
  --fg: #e8edf2;
  --fg2: #94a3b8;
  --fg3: #64748b;
  --border: #2d3a4a;
  --border-h: #3d4f63;
  --accent: #60a5fa;
  --accent-bg: #1e293b;
  --accent-border: #1e3a5f;
  --ext-c: #a78bfa;
  --ext-bg: #1e1b33;
  --cong-c: #60a5fa;
  --cong-bg: #1e293b;
  --refri-c: #34d399;
  --refri-bg: #1a2e28;
  --sist-c: #fb923c;
  --sist-bg: #2a1f14;
  --seal-c: #34d399;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  padding: 16px;
  max-width: 720px;
  margin: 0 auto;
}
.header {
  text-align: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--fg);
  margin-bottom: 4px;
}
.header p {
  font-size: 13px;
  color: var(--fg3);
}
.logo-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent-bg);
  border: 1px solid var(--accent-border);
  border-radius: 20px;
  padding: 4px 14px 4px 8px;
  margin-bottom: 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
}
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.tab {
  flex: 1;
  min-width: 70px;
  padding: 8px 6px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  color: var(--fg2);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  font-family: inherit;
}
.tab:hover { border-color: var(--border-h); }
.tab.on[data-k="e"] { background: var(--ext-bg); border-color: var(--ext-c); color: var(--ext-c); }
.tab.on[data-k="c"] { background: var(--cong-bg); border-color: var(--cong-c); color: var(--cong-c); }
.tab.on[data-k="r"] { background: var(--refri-bg); border-color: var(--refri-c); color: var(--refri-c); }
.tab.on[data-k="s"] { background: var(--sist-bg); border-color: var(--sist-c); color: var(--sist-c); }
.diagram { width: 100%; max-width: 520px; margin: 0 auto 20px auto; }
.cards { display: flex; flex-direction: column; gap: 6px; }
.card {
  padding: 12px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  transition: all 0.15s;
}
.card:hover, .card.on { border-color: var(--accent); background: var(--accent-bg); }
.card-head { display: flex; align-items: center; gap: 10px; }
.badge {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.card-title { font-size: 14px; font-weight: 600; color: var(--fg); }
.card-desc {
  font-size: 12.5px;
  color: var(--fg2);
  margin-top: 6px;
  padding-left: 36px;
  line-height: 1.55;
}
.mg { cursor: pointer; transition: opacity 0.2s; }
.mg.dim { opacity: 0.1; }
.mg.glow circle.mk { filter: drop-shadow(0 0 8px currentColor); }
.count-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--fg3);
  margin-top: 8px;
}
</style>
</head>

<script>
const D={
e:{l:'Superficie',c:'var(--ext-c)',p:[
{n:1,t:'Cubierta de vidrio templado/acero',d:'Superficie principal de la estufa. Puede ser vidrio templado (resistente a 400°C) o acero inoxidable 304. Vidrio: revisar microfisuras que provoquen quiebre repentino. Acero: verificar que no haya puntos de corrosion. Limpiar con productos no abrasivos. Si la cubierta de vidrio se raya se debilita estructuralmente.'},
{n:2,t:'Parrillas individuales',d:'Rejillas de hierro fundido o acero esmaltado que soportan ollas sobre el quemador. Peso soportado: 15-25 kg por parrilla. Fallas comunes: esmalte descascarado (oxida rapido), patas de apoyo desgastadas (olla se tambalea). Lavar a mano, nunca en lavavajillas. Verificar nivelacion con nivel de burbuja.'},
{n:3,t:'Quemadores (corona)',d:'Pieza metalica de aluminio o laton con orificios que distribuyen la llama. Potencia tipica: 1.5 kW (pequeno) a 3.5 kW (triple corona). Si la llama es amarilla o irregular: orificios tapados con residuos de comida. Limpiar con alfiler fino o aire comprimido. La llama ideal es azul con punta minima amarilla.'},
{n:4,t:'Perillas de control',d:'Regulan el paso de gas de cada quemador. Conectan al vastago de la valvula por acople estriado o pin en D. Si la perilla gira sin resistencia: vastago de la valvula roto o acople barrido. Reemplazar perilla o valvula segun el caso. Marcar posicion MIN/MAX al reinstalar.'},
{n:5,t:'Base de sellado',d:'Empaque perimetral entre la cubierta y la mesada. Sella para evitar filtracion de liquidos al interior. Material: silicona o caucho EPDM. Si hay infiltracion de agua al modulo electrico: reemplazar inmediatamente. Aplicar sellador de silicona de alta temperatura al reinstalar.'}
]},
c:{l:'Sistema de gas',c:'var(--cong-c)',p:[
{n:6,t:'Entrada de gas principal',d:'Punto de conexion donde la manguera trae gas desde la red o tanque. Rosca estandar 1/2" NPT o 3/8" SAE flare. Presion de trabajo: gas natural 18-25 mbar, GLP 28-37 mbar. SIEMPRE verificar con agua jabonosa que no haya fugas al reconectar. Si hay burbujeo: apretar o cambiar empaque.'},
{n:7,t:'Valvulas individuales por quemador',d:'Cada perilla controla una valvula de gas independiente. Tipo: valvula conico-axial con asiento de grasa siliconada. Si gotea gas con perilla cerrada: asiento desgastado, reemplazar valvula completa. No intentar rectificar el cono. Verificar hermeticidad con detector de gas o agua jabonosa.'},
{n:8,t:'Inyectores/boquillas',d:'Pequenos tornillos huecos con orificio calibrado que dosifican el gas al quemador. Diametro critico: GLP 0.65-0.85mm, gas natural 1.15-1.45mm segun potencia. Si se instala inyector incorrecto: llama amarilla (orificio grande) o llama debil con pop (orificio chico). Cambiar con llave de 7mm.'},
{n:9,t:'Tubo distribuidor de gas',d:'Tuberia interna (cobre o acero) que conecta la entrada de gas con cada valvula individual. Diametro tipico: 8-10mm. Verificar que no tenga fisuras ni corrosion en las soldaduras. En conversion gas natural a GLP: no se modifica el tubo, solo inyectores y regulador.'},
{n:10,t:'Regulador de presion',d:'Reduce la presion del tanque de gas (alta presion) a presion de trabajo del aparato. GLP: entrada ~1.5 bar, salida 28-37 mbar. Gas natural: generalmente no requiere regulador individual. Vida util: 5-10 anos. Si la llama fluctua: regulador defectuoso. Reemplazar, no reparar.'}
]},
r:{l:'Encendido',c:'var(--refri-c)',p:[
{n:11,t:'Electrodo de chispa (ignitor)',d:'Ceramica con punta metalica que genera arco electrico para encender el gas. Distancia de chispa: 3-4mm desde la corona del quemador. Si no genera chispa: punta sucia (limpiar con lija 400), ceramica rota o cable desconectado. No debe estar mojado. Si la chispa es debil y anaranjada: desgaste de punta.'},
{n:12,t:'Modulo generador de chispa',d:'Unidad electronica que genera pulsos de alto voltaje (15-20 kV) para los electrodos. Alimentacion: 110/220V AC o bateria (encendido a pila). Si ningun quemador hace chispa: modulo danado. Si solo uno falla: problema en cable o electrodo individual. Medir voltaje de salida con tester de chispa, nunca con multimetro comun.'},
{n:13,t:'Cable de alta tension',d:'Conductor aislado que lleva el pulso de alto voltaje del modulo al electrodo. Aislamiento de silicona resistente a calor. Si hay chispa errante o arco al chasis: aislamiento perforado. Revisar recorrido: no debe tocar partes metalicas ni estar cerca de manguera de gas. Reemplazar si el aislamiento esta endurecido o agrietado.'},
{n:14,t:'Termopar/termocopla',d:'Sensor bimetalico (cromel-alumel tipo K) que detecta presencia de llama generando 20-30 mV DC cuando se calienta. Si el quemador se apaga solo al soltar la perilla: termopar sucio, desalineado o agotado. Medir con multimetro en mV DC. Respuesta: debe alcanzar >15 mV en 30 segundos. Limpiar con lana de acero fina.'},
{n:15,t:'Valvula de seguridad termoelectrica',d:'Solenoide que se mantiene abierta con la corriente del termopar. Si la llama se apaga, el termopar se enfria, la corriente cesa y la valvula corta el gas en ~60 segundos. Bobina tipica: 15-50 ohm. Si no retiene: bobina abierta (medir con multimetro) o mecanismo atascado. Nunca puentear esta valvula de seguridad.'}
]},
s:{l:'Estructura',c:'var(--sist-c)',p:[
{n:16,t:'Marco perimetral',d:'Moldura de acero inoxidable o aluminio que rodea la cubierta y la fija a la mesada. Ancho tipico: 5-15mm. Funcion: proteger bordes del vidrio y dar acabado estetico. Si esta deformado: la cubierta no sella correctamente contra la mesada. Verificar que los clips de sujecion esten completos al reinstalar.'},
{n:17,t:'Charola recolectora de derrames',d:'Bandeja metalica bajo la cubierta que recoge liquidos derramados. Material: acero galvanizado o aluminio. Si no se limpia: corrosion y malos olores. Acceso: levantar la cubierta o desmontar por debajo. Limpiar con desengrasante y secar completamente. Verificar que el drenaje no este obstruido.'},
{n:18,t:'Manguera de conexion',d:'Conducto flexible que conecta la red de gas con la entrada de la cubierta. Material aprobado: acero inoxidable corrugado (vida util 10+ anos) o caucho reforzado con malla (vencimiento impreso, tipico 5 anos). Largo maximo: 1.5m. NUNCA usar manguera vencida. Verificar estado de empaques y abrazaderas en cada servicio.'},
{n:19,t:'Abrazaderas de sujecion',d:'Grapas o clips metalicos que fijan la cubierta al hueco de la mesada. Tipicamente 4-6 unidades con tornillo de apriete. Torque recomendado: ajustar firme sin deformar la mesada. Si faltan abrazaderas la cubierta puede levantarse con el peso de una olla. Al reinstalar, distribuir uniformemente alrededor del perimetro.'},
{n:20,t:'Empaques y sellos',d:'Juntas de goma, teflón o fibra en todas las conexiones de gas. Incluye: empaque de la entrada principal, o-rings de valvulas, cinta teflon en roscas NPT. Vida util variable segun material y temperatura. En cada servicio: revisar todos los empaques visualmente y con prueba de jabon. Reemplazar cualquiera que este endurecido, aplastado o agrietado.'}
]}
};
const K=['e','c','r','s'];
let cur='e';
function init(){
document.getElementById('tb').innerHTML=K.map(k=>'<button class="tab'+(k===cur?' on':'')+'" data-k="'+k+'" onclick="sh(\''+k+'\')">'+D[k].l+'</button>').join('');
sh('e');
}
function sh(k){
cur=k;
document.querySelectorAll('.tab').forEach((b,i)=>{b.classList.toggle('on',K[i]===k)});
const c=document.getElementById('cards');
const s=D[k];
c.innerHTML=s.p.map((p,i)=>'<div class="card" ontouchstart="hi(\''+k+'\','+i+')" ontouchend="lo()" onmouseenter="hi(\''+k+'\','+i+')" onmouseleave="lo()"><div class="card-head"><span class="badge" style="background:'+s.c+'">'+p.n+'</span><span class="card-title">'+p.t+'</span></div><div class="card-desc">'+p.d+'</div></div>').join('');
lo();
}
function hi(k,i){
document.querySelectorAll('.mg').forEach(g=>{
if(g.dataset.s===k&&parseInt(g.dataset.i)===i){g.classList.remove('dim');g.classList.add('glow');}
else{g.classList.add('dim');g.classList.remove('glow');}
});
}
function lo(){
document.querySelectorAll('.mg').forEach(g=>{
if(g.dataset.s===cur){g.classList.remove('dim');g.classList.remove('glow');}
else{g.classList.add('dim');g.classList.remove('glow');}
});
}
init();
</script>
