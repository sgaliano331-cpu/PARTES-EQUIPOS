<style>
:root {
  --bg: #f8fafb;

  --fg: #1a2332;

  --cong-bg: #eff6ff;
  --refri-c: #059669;
  --refri-bg: #ecfdf5;
  --sist-c: #ea580c;
  --sist-bg: #fff7ed;
  --seal-c: #10b981;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1419;
    --bg-card: #1a2332;
    --fg: #e8edf2;
    --fg2: #94a3b8;
    --fg3: #64748b;
    --border: #2d3a4a;
    --border-h: #3d4f63;
    --accent: #60a5fa;
    --accent-bg: #1e293b;
    --accent-border: #1e3a5f;
    --ext-c: #a78bfa;
    --ext-bg: #1e1b33;
    --cong-c: #60a5fa;
    --cong-bg: #1e293b;
    --refri-c: #34d399;
    --refri-bg: #1a2e28;
    --sist-c: #fb923c;
    --sist-bg: #2a1f14;
    --seal-c: #34d399;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1419;
  --bg-card: #1a2332;
  --fg: #e8edf2;
  --fg2: #94a3b8;
  --fg3: #64748b;
  --border: #2d3a4a;
  --border-h: #3d4f63;
  --accent: #60a5fa;
  --accent-bg: #1e293b;
  --accent-border: #1e3a5f;
  --ext-c: #a78bfa;
  --ext-bg: #1e1b33;
  --cong-c: #60a5fa;
  --cong-bg: #1e293b;
  --refri-c: #34d399;
  --refri-bg: #1a2e28;
  --sist-c: #fb923c;
  --sist-bg: #2a1f14;
  --seal-c: #34d399;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  padding: 16px;
  max-width: 720px;
  margin: 0 auto;
}
.header {
  text-align: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--fg);
  margin-bottom: 4px;
}
.header p {
  font-size: 13px;
  color: var(--fg3);
}
.logo-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent-bg);
  border: 1px solid var(--accent-border);
  border-radius: 20px;
  padding: 4px 14px 4px 8px;
  margin-bottom: 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
}
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.tab {
  flex: 1;
  min-width: 70px;
  padding: 8px 6px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  color: var(--fg2);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  font-family: inherit;
}
.tab:hover { border-color: var(--border-h); }
.tab.on[data-k="e"] { background: var(--ext-bg); border-color: var(--ext-c); color: var(--ext-c); }
.tab.on[data-k="c"] { background: var(--cong-bg); border-color: var(--cong-c); color: var(--cong-c); }
.tab.on[data-k="r"] { background: var(--refri-bg); border-color: var(--refri-c); color: var(--refri-c); }
.tab.on[data-k="s"] { background: var(--sist-bg); border-color: var(--sist-c); color: var(--sist-c); }
.diagram { width: 100%; max-width: 520px; margin: 0 auto 20px auto; }
.cards { display: flex; flex-direction: column; gap: 6px; }
.card {
  padding: 12px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  transition: all 0.15s;
}
.card:hover, .card.on { border-color: var(--accent); background: var(--accent-bg); }
.card-head { display: flex; align-items: center; gap: 10px; }
.badge {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.card-title { font-size: 14px; font-weight: 600; color: var(--fg); }
.card-desc {
  font-size: 12.5px;
  color: var(--fg2);
  margin-top: 6px;
  padding-left: 36px;
  line-height: 1.55;
}
.mg { cursor: pointer; transition: opacity 0.2s; }
.mg.dim { opacity: 0.1; }
.mg.glow circle.mk { filter: drop-shadow(0 0 8px currentColor); }
.count-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--fg3);
  margin-top: 8px;
}
</style>
</head>

<div class="cards" id="cards"></div>

<script>
const D={
e:{l:'Exterior',c:'var(--ext-c)',p:[
{n:1,t:'Carcasa / cubierta decorativa',d:'Estructura externa de acero inoxidable o aluminio anodizado que cubre la campana y el conducto. En modelos de pared, incluye chimenea telescopica. Limpieza con paño humedo y desengrasante neutro. Si presenta abolladuras: verificar anclaje a pared y soporte del conducto. Grosor tipico: 0.5-0.8 mm.'},
{n:2,t:'Panel de control (botones/tactil)',d:'Controla velocidades del motor (tipico 3 niveles: 200-400 m3/h) y la iluminacion. Puede ser mecanico (pulsadores) o tactil (capacitivo). Si no responde: limpiar superficie grasa del panel tactil, verificar cinta flex de conexion a tarjeta. Los botones mecanicos fallan por acumulacion de grasa interna.'},
{n:3,t:'Iluminacion LED/halogena',d:'2 o 4 focos LED (1.5-3W cada uno, GU10 o integrado) o halogenos (20W G4). Iluminan la zona de coccion. Si parpadean: verificar transformador de 12V y conexion del socket. LEDs: vida util 25,000 hrs. Halogenos: 2,000 hrs. No tocar halogenos con los dedos (grasa acorta vida).'},
{n:4,t:'Visera frontal',d:'Panel abatible o fijo en la parte frontal inferior que amplia el area de captura de humos. En modelos telescopicos, al extraerla se enciende la campana automaticamente via microswitch. Si no activa: revisar microswitch de posicion (NO/NC). Material: vidrio templado o acero.'},
{n:5,t:'Marco perimetral',d:'Moldura metalica que sella la union entre la carcasa y los filtros inferiores. Evita fugas de aire y vibraciones. Si hay ruido de traqueteo: verificar que los clips de retencion no esten rotos y que los filtros encajen correctamente en las guias.'}
]},
c:{l:'Filtracion',c:'var(--cong-c)',p:[
{n:6,t:'Filtro de grasa metalico (baffle/malla)',d:'Filtro de acero inoxidable o aluminio que atrapa particulas de grasa del humo. Tipos: baffle (deflector, mas eficiente en cocina profesional) y malla (hogar). Lavar en lavavajillas cada 2-4 semanas o cuando se vea saturado. Si esta tapado: el motor trabaja forzado, reduce extraccion un 30-50% y puede sobrecalentarse.'},
{n:7,t:'Filtro de carbon activado (recirculacion)',d:'Solo en modo recirculacion (sin salida exterior). Absorbe olores mediante carbon activado granulado. NO es lavable: reemplazar cada 3-6 meses segun uso. Modelo universal: diametro 210mm, espesor 30mm. Si persisten olores: filtro agotado. Algunos modelos usan filtro largo rectangular.'},
{n:8,t:'Charola recolectora de grasa',d:'Bandeja plastica o metalica ubicada debajo de los filtros que recoge grasa liquida condensada. Capacidad tipica: 50-100 ml. Vaciar y limpiar semanalmente con agua caliente y desengrasante. Si rebosa: la grasa cae sobre la estufa (riesgo de incendio). Verificar que la junta de la charola selle correctamente.'},
{n:9,t:'Rejilla de succion',d:'Estructura perforada o de laminas en la parte inferior que distribuye uniformemente la aspiracion del aire. Si se obstruye con grasa acumulada, reduce el caudal de extraccion. Limpiar con desengrasante cada mes. Material: acero inoxidable o aluminio. Verificar que no tenga deformaciones que alteren el flujo.'},
{n:10,t:'Conducto de salida',d:'Tubo circular (diametro 120 o 150 mm) o rectangular que lleva el aire al exterior. Material: aluminio flexible o PVC rigido. Longitud maxima recomendada: 3m con maximo 2 codos de 90°. Cada codo adicional reduce eficiencia un 10-15%. Si no extrae bien: buscar aplastamientos, condensacion o nido de aves.'}
]},
r:{l:'Motor y vent.',c:'var(--refri-c)',p:[
{n:11,t:'Motor del extractor',d:'Motor electrico monofasico (80-250W en hogar, hasta 500W en industrial). Velocidades controladas por capacitor o tarjeta electronica. Si no arranca: medir continuidad de bobinas con multimetro (resistencia tipica 20-80 ohm). Si zumba pero no gira: eje trabado por grasa o rodamientos dañados. Vida util: 8-12 años.'},
{n:12,t:'Turbina / ventilador centrifugo',d:'Rotor con alabes curvos montado en el eje del motor. Genera succion centrifuga de 300-800 m3/h segun modelo. Si vibra: desbalanceo por acumulacion de grasa en los alabes. Limpiar con desengrasante y cepillo suave. Verificar que el tornillo de fijacion (prisionero) al eje no este flojo. Si un alabe se rompe: reemplazar completa.'},
{n:13,t:'Carcasa del motor (caracol)',d:'Caja espiral (voluta) que envuelve la turbina y direcciona el aire hacia el conducto de salida. Fabricada en plastico ABS o chapa galvanizada. Si se acumula grasa interna: reduce eficiencia y genera ruido. Acceder desensamblando la campana, desconectando cables del motor y retirando los tornillos de la voluta.'},
{n:14,t:'Amortiguadores de vibracion',d:'Tacos de goma o silicona (silent-blocks) entre el motor y la carcasa de la campana. Absorben vibracion y reducen ruido de operacion. Si la campana vibra excesivamente: revisar si los amortiguadores estan endurecidos, aplastados o faltantes. Reemplazo: medidas tipicas 20x15mm con rosca M5 o M6. Dureza Shore A 40-60.'},
{n:15,t:'Valvula antirretorno (damper)',d:'Compuerta de gravedad o resorte dentro del conducto de salida. Impide que entre aire frio, olores o insectos cuando la campana esta apagada. Si no cierra: verificar que las aletas no tengan grasa acumulada que las trabe. Si entra corriente con campana apagada: damper trabado o faltante. Modelos: mariposa, guillotina.'}
]},
s:{l:'Electrico',c:'var(--sist-c)',p:[
{n:16,t:'Interruptor de velocidades',d:'Selector rotativo o de posiciones (Off/1/2/3) que cambia la velocidad del motor. En modelos mecanicos: switch de 4 posiciones que conecta diferentes taps del devanado o conmuta capacitores. Si una velocidad no funciona: medir continuidad en cada posicion. Falla comun: contactos internos quemados por arcos electricos.'},
{n:17,t:'Capacitor del motor',d:'Capacitor de marcha (2-6 uF / 450V) que genera desfase para el arranque y operacion del motor monofasico. Si el motor zumba pero no gira, o gira lento: medir con capacimetro (tolerancia +-5%). Capacitor hinchado o con fuga de aceite = cambiar inmediatamente. Siempre reemplazar con mismo valor y voltaje.'},
{n:18,t:'Tarjeta electronica',d:'PCB que gestiona velocidades, temporizador automatico, indicador de filtro saturado y funcion boost. Alimentacion tipica: 120-240V AC. Si no enciende nada: verificar fusible en tarjeta, revisar transformador y diodos rectificadores. Proteger con varistor MOV contra picos de voltaje. Falla comun: triac de control de velocidad quemado.'},
{n:19,t:'Cableado y conectores',d:'Cables de alimentacion (AWG 16-18) y conectores faston 6.3mm que interconectan motor, panel, luces y tarjeta. Verificar que no haya cables derretidos por calor de la cocina. Conexiones flojas generan arcos y falsos contactos. Usar terminales engarzadas, nunca cinta aislante en zona de calor. Respetar codigo de colores: azul neutro, marron fase, verde/amarillo tierra.'},
{n:20,t:'Transformador de iluminacion',d:'Transformador reductor 220V/120V a 12V para alimentar focos halogenos o LED de bajo voltaje. Potencia: 20-60W segun numero de focos. Si las luces no encienden pero el motor si: medir salida del transformador con multimetro AC. Salida correcta: 11.5-12.5V. Si esta abierto (sin continuidad en primario): reemplazar por uno del mismo voltaje y potencia.'}
]}
};
const K=['e','c','r','s'];
let cur='e';
function init(){
document.getElementById('tb').innerHTML=K.map(k=>'<button class="tab'+(k===cur?' on':'')+'" data-k="'+k+'" onclick="sh(\''+k+'\')">'+D[k].l+'</button>').join('');
sh('e');
}
function sh(k){
cur=k;
document.querySelectorAll('.tab').forEach((b,i)=>{b.classList.toggle('on',K[i]===k)});
const c=document.getElementById('cards');
const s=D[k];
c.innerHTML=s.p.map((p,i)=>'<div class="card" ontouchstart="hi(\''+k+'\','+i+')" ontouchend="lo()" onmouseenter="hi(\''+k+'\','+i+')" onmouseleave="lo()"><div class="card-head"><span class="badge" style="background:'+s.c+'">'+p.n+'</span><span class="card-title">'+p.t+'</span></div><div class="card-desc">'+p.d+'</div></div>').join('');
lo();
}
function hi(k,i){
document.querySelectorAll('.mg').forEach(g=>{
if(g.dataset.s===k&&parseInt(g.dataset.i)===i){g.classList.remove('dim');g.classList.add('glow');}
else{g.classList.add('dim');g.classList.remove('glow');}
});
}
function lo(){
document.querySelectorAll('.mg').forEach(g=>{
if(g.dataset.s===cur){g.classList.remove('dim');g.classList.remove('glow');}
else{g.classList.add('dim');g.classList.remove('glow');}
});
}
init();
</script>
