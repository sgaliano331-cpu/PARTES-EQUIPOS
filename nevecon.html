* { box-sizing: border-box; margin: 0; padding: 0; }
body {

  margin: 0 auto;
}
.header {
  text-align: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--fg);
  margin-bottom: 4px;
}
.header p {
  font-size: 13px;
  color: var(--fg3);
}
.logo-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent-bg);
  border: 1px solid var(--accent-border);
  border-radius: 20px;
  padding: 4px 14px 4px 8px;
  margin-bottom: 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
}
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.tab {
  flex: 1;
  min-width: 70px;
  padding: 8px 6px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  color: var(--fg2);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  font-family: inherit;
}
.tab:hover { border-color: var(--border-h); }
.tab.on[data-k="e"] { background: var(--ext-bg); border-color: var(--ext-c); color: var(--ext-c); }
.tab.on[data-k="c"] { background: var(--cong-bg); border-color: var(--cong-c); color: var(--cong-c); }
.tab.on[data-k="r"] { background: var(--refri-bg); border-color: var(--refri-c); color: var(--refri-c); }
.tab.on[data-k="s"] { background: var(--sist-bg); border-color: var(--sist-c); color: var(--sist-c); }
.diagram { width: 100%; max-width: 520px; margin: 0 auto 20px auto; }
.cards { display: flex; flex-direction: column; gap: 6px; }
.card {
  padding: 12px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  transition: all 0.15s;
}
.card:hover, .card.on { border-color: var(--accent); background: var(--accent-bg); }
.card-head { display: flex; align-items: center; gap: 10px; }
.badge {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.card-title { font-size: 14px; font-weight: 600; color: var(--fg); }
.card-desc {
  font-size: 12.5px;
  color: var(--fg2);
  margin-top: 6px;
  padding-left: 36px;
  line-height: 1.55;
}
.mg { cursor: pointer; transition: opacity 0.2s; }
.mg.dim { opacity: 0.1; }
.mg.glow circle.mk { filter: drop-shadow(0 0 8px currentColor); }
.count-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--fg3);
  margin-top: 8px;
}
</style>

{n:1,t:'Puerta con vidrio templado',d:'Puerta de una sola hoja con vidrio templado doble o triple capa que permite ver el contenido sin abrir. Espesor tipico: 15-20 mm con camara de gas argon para aislamiento. Si se empaña por dentro: el sello perimetral del vidrio esta roto y hay que reemplazar la unidad completa. Temperatura de operacion: soporta de -30°C a 50°C sin riesgo de fractura.'},
{n:2,t:'Manija industrial',d:'Barra vertical de acero inoxidable o aluminio anodizado, fijada con 4-6 tornillos pasantes. Longitud tipica: 40-60 cm. Diseñada para uso intensivo en cocinas comerciales. Si se afloja: verificar que los espaciadores internos no esten aplastados y que los bujes roscados en la puerta no esten barridos. Torque de apriete recomendado: 3-4 Nm.'},
{n:3,t:'Carcasa en acero inoxidable',d:'Gabinete exterior en lamina calibre 22-24 de acero inoxidable 304 o 430. Resistente a corrosion y facil de sanitizar. Si aparecen manchas de oxido: el grado es 430 (magnetico) y hay que aplicar pasivador. Limpiar con paño humedo y detergente neutro, nunca con esponjas abrasivas que rayan el acabado.'},
{n:4,t:'Patas niveladoras con ruedas',d:'4 patas con ruedas giratorias (2 con freno). Carga por rueda: 50-80 kg. Altura ajustable 10-15 cm para nivelar en pisos irregulares. Para mover el equipo: soltar frenos, desplazar y volver a frenar. Verificar periodicamente que las ruedas giren libremente y no tengan residuos acumulados que impidan el movimiento.'},
{n:5,t:'Panel de control digital',d:'Pantalla LED o LCD con teclado de membrana. Muestra temperatura actual, setpoint, alarmas y modo de operacion (normal/descongelamiento). Parametros ajustables: temperatura (-5°C a -25°C), histéresis (1-3°C), tiempo de descongelamiento. Si no enciende: verificar fusible interno de 2A y voltaje de alimentacion en la tarjeta.'}
]},
c:{l:'Compartimento',c:'var(--cong-c)',p:[
{n:6,t:'Parrillas ajustables cromadas',d:'Estantes de varilla de acero cromado o recubierto en epoxi, ajustables en altura cada 25-50 mm mediante ranuras laterales. Capacidad: 30-50 kg por parrilla segun modelo. No sobrecargar ni bloquear la circulacion de aire entre estantes. Si el cromado se descascara: reemplazar para evitar contaminacion en alimentos.'},
{n:7,t:'Iluminacion LED interior',d:'Tira o modulo LED de 12V o 24V con difusor, activado por switch de puerta. Consumo: 3-8W. Temperatura de color: 4000-6500K. Si no enciende: medir voltaje en el conector del LED, verificar switch de puerta (debe tener continuidad con puerta abierta). Vida util tipica: 30.000-50.000 horas.'},
{n:8,t:'Empaque magnetico reforzado',d:'Burleta perimetral con doble o triple camara de iman, diseñada para uso comercial de alta frecuencia de apertura. Si la puerta no sella: hacer la prueba del papel (cerrar con una hoja, si se desliza hay que cambiar el empaque). Deformaciones por calor se corrigen aplicando calor con secador y moldeando. Limpieza semanal con agua jabonosa.'},
{n:9,t:'Bisagras de cierre automatico',d:'Bisagras con resorte interno que cierran la puerta automaticamente cuando se suelta. Angulo de cierre automatico: desde 45-60 grados. Si la puerta no cierra sola: ajustar tension del resorte con llave Allen (sentido horario = mas fuerza). Si esta vencida: reemplazar el cartucho de resorte interno. Verificar alineacion de la puerta.'},
{n:10,t:'Gavetas inferiores',d:'Cajones deslizantes en la parte baja del compartimento para almacenar productos pesados o de alta rotacion. Rieles telescopicos de acero. Capacidad: 20-30 kg por gaveta. Si se traban: limpiar rieles con desengrasante y lubricar con grasa grado alimenticio. Verificar que los topes plasticos no esten rotos.'}
]},
r:{l:'Sistema de frio',c:'var(--refri-c)',p:[
{n:11,t:'Compresor de alta capacidad',d:'Compresor hermetico de 1/3 a 1 HP para equipos comerciales. Refrigerantes: R134a, R290 o R404A segun modelo. Consumo: 300-700W. Si hace click y no arranca: medir bobinas (comun-arranque 15-25Ω, comun-marcha 8-15Ω). Verificar relay PTC y protector termico. Presion de succion normal: 2-8 PSI (R134a).'},
{n:12,t:'Evaporador (serpentin)',d:'Serpentin de tubo de cobre o aluminio con aletas, ubicado detras del panel trasero interior. Absorbe calor del compartimento. Temperatura de operacion: -25°C a -30°C. Si se forma bloque de hielo: falla en sistema de descongelamiento (resistencia, timer o sensor defrost). Verificar que no haya fugas con detector electronico.'},
{n:13,t:'Condensador ventilado',d:'Serpentin con aletas ubicado en la parte inferior trasera. Disipa el calor al exterior. Temperatura de salida normal: 45-60°C. Si esta obstruido con polvo o grasa: la presion de descarga sube y el compresor se sobrecalienta. Limpiar con cepillo y aire comprimido cada 30-60 dias en ambientes de cocina.'},
{n:14,t:'Ventilador del evaporador',d:'Motor de 10-25W que fuerza la circulacion de aire frio dentro del compartimento. Velocidad: 1300-1800 RPM. Si no gira: medir continuidad del bobinado (debe dar 200-800Ω). Si hace ruido: hielo en aspas o rodamientos desgastados. Se detiene automaticamente al abrir la puerta via switch.'},
{n:15,t:'Gas refrigerante (R134a/R290)',d:'Carga tipica: 100-300 gramos segun modelo. R134a: presion trabajo baja 2-8 PSI, alta 120-170 PSI. R290 (propano): inflamable, carga maxima limitada (150g), requiere herramientas antiexplosion. Si hay fuga: detectar con jabon o detector electronico. Solo tecnicos certificados deben manipular refrigerantes.'}
]},
s:{l:'Electrico y control',c:'var(--sist-c)',p:[
{n:16,t:'Termostato digital',d:'Controlador electronico (Carel, Dixell, Full Gauge) que regula temperatura con precision de ±0.5°C. Alimentacion: 110/220V segun modelo. Parametros principales: SP (setpoint), HY (histeresis), LS/HS (limites). Si muestra "E1" o "E2": falla del sensor. Para calibrar: comparar con termometro patron y ajustar offset (parametro OFS).'},
{n:17,t:'Tarjeta electronica',d:'PCB principal que gestiona compresor, ventiladores, descongelamiento, alarmas y display. Si tiene componentes quemados: revisar capacitores hinchados, reles pegados y fusibles. Proteger contra picos de voltaje con regulador o supresor de transientes (varistor MOV). Voltaje de operacion: 5V logica, 12/24V reles, 110/220V potencia.'},
{n:18,t:'Sensor de temperatura (termistor)',d:'Sensor NTC (coeficiente negativo) que mide temperatura y envia señal al controlador. Resistencia tipica: 10kΩ a 25°C (verificar tabla del fabricante). Si esta en corto: controlador muestra error y apaga compresor. Si esta abierto: controlador mantiene compresor encendido permanentemente. Medir con multimetro desconectado.'},
{n:19,t:'Timer de descongelamiento',d:'Programador que activa el ciclo de descongelamiento cada 6-12 horas por 20-30 minutos. En equipos digitales es electronico (parametro del controlador). En analogicos es mecanico (motor sincrono). Si el evaporador se congela en bloque: verificar timer avanzandolo manualmente con destornillador. Comprobar que active la resistencia.'},
{n:20,t:'Resistencia de descongelamiento',d:'Elemento calefactor de 200-500W ubicado en el evaporador. Derrite el hielo acumulado durante el ciclo de descongelamiento. Tipos: tubular (aluminio), vidrio (cuarzo) o cable calefactor. Medir continuidad con multimetro: debe dar 30-100Ω (segun potencia). Si esta abierta (infinito): reemplazar. Verificar tambien el termostato de limite (bimetalico) que la protege.'}
]}
};
const K=['e','c','r','s'];
let cur='e';
function init(){
document.getElementById('tb').innerHTML=K.map(k=>'<button class="tab'+(k===cur?' on':'')+'" data-k="'+k+'" onclick="sh(\''+k+'\')">'+D[k].l+'</button>').join('');
sh('e');
}
function sh(k){
cur=k;
document.querySelectorAll('.tab').forEach((b,i)=>{b.classList.toggle('on',K[i]===k)});
const c=document.getElementById('cards');
const s=D[k];
c.innerHTML=s.p.map((p,i)=>'<div class="card" ontouchstart="hi(\''+k+'\','+i+')" ontouchend="lo()" onmouseenter="hi(\''+k+'\','+i+')" onmouseleave="lo()"><div class="card-head"><span class="badge" style="background:'+s.c+'">'+p.n+'</span><span class="card-title">'+p.t+'</span></div><div class="card-desc">'+p.d+'</div></div>').join('');
lo();
}
function hi(k,i){
document.querySelectorAll('.mg').forEach(g=>{
if(g.dataset.s===k&&parseInt(g.dataset.i)===i){g.classList.remove('dim');g.classList.add('glow');}
else{g.classList.add('dim');g.classList.remove('glow');}
});
}
function lo(){
document.querySelectorAll('.mg').forEach(g=>{
if(g.dataset.s===cur){g.classList.remove('dim');g.classList.remove('glow');}
else{g.classList.add('dim');g.classList.remove('glow');}
});
}
init();
</script>
