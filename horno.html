.tabs {

}
.tab {
  flex: 1;
  min-width: 70px;
  padding: 8px 6px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  color: var(--fg2);

  text-align: center;

.tab:hover { border-color: var(--border-h); }
.tab.on[data-k="e"] { background: var(--ext-bg); border-color: var(--ext-c); color: var(--ext-c); }

.tab.on[data-k="r"] { background: var(--refri-bg); border-color: var(--refri-c); color: var(--refri-c); }
.tab.on[data-k="s"] { background: var(--sist-bg); border-color: var(--sist-c); color: var(--sist-c); }
.diagram { width: 100%; max-width: 520px; margin: 0 auto 20px auto; }
.cards { display: flex; flex-direction: column; gap: 6px; }
.card {
  padding: 12px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  transition: all 0.15s;
}
.card:hover, .card.on { border-color: var(--accent); background: var(--accent-bg); }
.card-head { display: flex; align-items: center; gap: 10px; }
.badge {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;

  flex-shrink: 0;

.card-title { font-size: 14px; font-weight: 600; color: var(--fg); }
.card-desc {
  font-size: 12.5px;
  color: var(--fg2);
  margin-top: 6px;
  padding-left: 36px;
  line-height: 1.55;
}
.mg { cursor: pointer; transition: opacity 0.2s; }
.mg.dim { opacity: 0.1; }
.mg.glow circle.mk { filter: drop-shadow(0 0 8px currentColor); }
.count-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--fg3);

{n:1,t:'Puerta con vidrio templado doble',d:'Puerta principal del horno con doble vidrio templado resistente a 300°C+. Reduce la temperatura exterior a menos de 60°C durante operacion. Si el vidrio esta roto o con fisuras: reemplazar inmediatamente por riesgo de quemaduras. Limpiar con limpiador no abrasivo. Verificar que los clips de retencion esten firmes.'},
{n:2,t:'Manija de puerta',d:'Barra de agarre en acero inoxidable o plastico termoresistente. Soporta temperaturas de superficie hasta 70°C. Si se afloja: revisar los 2-4 tornillos de fijacion traseros accediendo por la cara interior de la puerta. Verificar insertos roscados no barridos.'},
{n:3,t:'Panel de control',d:'Zona superior con indicadores de temperatura, selector de funcion y timer. En modelos electronicos incluye display LED/LCD. Si el display no enciende: verificar 120/220V en la tarjeta de control y fusible termico. En modelos mecanicos, verificar continuidad del switch selector.'},
{n:4,t:'Perillas de temperatura/funcion',d:'Controles giratorios que regulan temperatura (150-300°C) y modo de coccion (hornear, gratinar, ambos). Eje conectado a la valvula termostatica mediante varilla. Si gira sin efecto: eje de valvula partido o desacoplado. Si queda dura: acumulacion de grasa en el eje. Limpiar con desengrasante.'},
{n:5,t:'Bisagras de puerta',d:'Mecanismo de resorte que permite apertura a 90° y retencion parcial. Soportan el peso de la puerta (5-12 kg). Si la puerta no cierra bien: resorte fatigado o roto, reemplazar ambas bisagras al tiempo. Si cierra con golpe: amortiguador desgastado. Lubricar con grasa de alta temperatura.'}
]},
c:{l:'Interior',c:'var(--cong-c)',p:[
{n:6,t:'Cavidad del horno (camara)',d:'Espacio interior esmaltado o de acero inoxidable donde se cocina. Capacidad tipica: 50-80 litros. El esmalte debe estar intacto para reflejar calor uniformemente. Si hay descascaramiento: pierde eficiencia termica y facilita corrosion. Temperatura uniforme ideal: variacion maxima 10°C entre zonas.'},
{n:7,t:'Parrillas/rejillas ajustables',d:'Estantes de acero cromado o niquelado con 3-5 posiciones de altura. Soportan 8-15 kg. Posicion baja para asados largos, media para horneado general, alta para gratinar. Si estan deformadas por calor: reemplazar. Limpiar con bicarbonato y agua caliente para remover grasa quemada.'},
{n:8,t:'Bandeja recolectora de grasa',d:'Charola en la base del horno que recoge goteo de grasa y jugos. Previene que la grasa caiga sobre el quemador inferior causando humo y llama. Limpiar despues de cada uso con desengrasante. Si esta deformada o corroida: reemplazar. Usar papel aluminio como protector no es recomendado por riesgo de bloqueo de flujo de aire.'},
{n:9,t:'Luz interior del horno',d:'Bombilla halógena o incandescente de 15-40W, tipo E14 o G9, resistente a 300°C. Permite ver los alimentos sin abrir la puerta. Si no enciende: verificar bombilla (medir continuidad) y door switch. El vidrio protector debe estar sellado. Desconectar corriente antes de cambiar la bombilla. Usar solo bombillas para horno, las comunes explotan con el calor.'},
{n:10,t:'Sello/empaque de puerta',d:'Junta de fibra de vidrio trenzada o silicona que rodea la abertura del horno. Sella para mantener calor y evitar fugas de gas caliente. Prueba: con el horno a 200°C, pasar la mano a 2 cm del borde; si siente calor excesivo, reemplazar. Vida util: 3-5 anos. No usar adhesivos comunes, solo los especificados por el fabricante.'}
]},
r:{l:'Gas y calor',c:'var(--refri-c)',p:[
{n:11,t:'Quemador inferior (hornear)',d:'Tubo de acero perforado en la base del horno que produce llama para horneado por conveccion natural. Potencia: 2000-3500W (6000-12000 BTU). Llama ideal: azul uniforme. Si la llama es amarilla o irregular: orificios tapados con residuos de comida, limpiar con cepillo de alambre fino y aire comprimido. Verificar presion de gas: 18-20 mbar (gas natural) o 28-30 mbar (propano).'},
{n:12,t:'Quemador superior (gratinar/broil)',d:'Tubo perforado en el techo del horno para calor directo desde arriba. Potencia: 1500-2500W. Usado para dorar, gratinar y tostar. Si no enciende: verificar valvula de paso y electrodo de ignicion. La distancia de la llama al alimento debe ser 8-12 cm minimo. No usar en modo broil con puerta cerrada si el manual indica puerta entreabierta.'},
{n:13,t:'Valvula termostatica',d:'Dispositivo mecanico que regula el flujo de gas segun la temperatura seleccionada. Contiene bulbo sensor con liquido que se expande con el calor. Si la temperatura es imprecisa: calibrar con termometro de horno. Si no corta el gas al alcanzar la temperatura: valvula defectuosa, reemplazar completa. Rango tipico: 140-290°C. Costo pieza: $80-250 USD.'},
{n:14,t:'Termopar de seguridad',d:'Sensor bimetalico que detecta presencia de llama. Genera 20-30 milivoltios cuando se calienta, manteniendo abierta la valvula de seguridad. Si el horno se apaga solo despues de encender: termopar sucio o defectuoso. Limpiar con lija fina #400. Medir con multimetro en milivoltios: menos de 15mV = reemplazar. Tiempo de respuesta normal: 15-30 segundos.'},
{n:15,t:'Encendido electronico (ignitor)',d:'Electrodo ceramico que genera chispa de alto voltaje (~15kV) para encender el gas. Si hace click pero no enciende: electrodo sucio o desalineado. Distancia correcta al quemador: 3-5 mm. Si no hace click: modulo de ignicion fallando o cable roto. Limpiar electrodo con alcohol isopropilico. No tocar la punta ceramica con herramientas metalicas.'}
]},
s:{l:'Control y seguridad',c:'var(--sist-c)',p:[
{n:16,t:'Termostato',d:'Control maestro de temperatura del horno. En modelos mecanicos: capilar con bulbo sensor lleno de liquido. En electronicos: tarjeta con sensor NTC/termistor. Resistencia NTC tipica: 50kΩ a 25°C, 2.5kΩ a 200°C. Si la temperatura oscila excesivamente (±30°C): termostato descalibrado o sensor defectuoso. Calibracion: ajustar tornillo en el eje de la perilla.'},
{n:17,t:'Valvula de seguridad',d:'Dispositivo electromagnetico controlado por el termopar. Corta el flujo de gas automaticamente si la llama se apaga. Bobina de ~500Ω. Si el gas no fluye aunque la perilla esta abierta: bobina quemada o termopar desconectado. Medir continuidad de bobina con multimetro. No puentear nunca esta valvula: riesgo de explosion por acumulacion de gas.'},
{n:18,t:'Ventilador de enfriamiento',d:'Motor de 10-25W ubicado en la parte superior trasera. Fuerza aire entre la carcasa exterior y la camara del horno para enfriar la superficie externa y los controles electronicos. Se activa al superar 60°C y continua varios minutos despues de apagar. Si no gira: motor quemado o capacitor defectuoso. Si hace ruido: rodamientos desgastados. Medir bobina: 200-400Ω.'},
{n:19,t:'Timer/temporizador',d:'Mecanismo de relojeria o electronico que controla el tiempo de coccion. En modelos mecanicos: cuerda de 120 minutos con campana. En electronicos: rango de 1 min a 10 horas con alarma. Si el timer mecanico no avanza: engranajes trabados o resorte roto. Si el electronico no programa: verificar alimentacion y micro-switch de contacto. El timer puede cortar energia al horno al finalizar.'},
{n:20,t:'Sensor de temperatura',d:'Termistor NTC o termopar tipo K que mide la temperatura real dentro de la camara y envia señal a la tarjeta electronica. Ubicado generalmente en la pared superior trasera. Resistencia a 200°C: 1-3 kΩ (depende del modelo). Si muestra error E1/F3 en el display: sensor abierto o en corto. Verificar cableado y conector antes de reemplazar. No doblar el cable sensor bruscamente.'}
]}
};
const K=['e','c','r','s'];
let cur='e';
function init(){
document.getElementById('tb').innerHTML=K.map(k=>'<button class="tab'+(k===cur?' on':'')+'" data-k="'+k+'" onclick="sh(\''+k+'\')">'+D[k].l+'</button>').join('');
sh('e');
}
function sh(k){
cur=k;
document.querySelectorAll('.tab').forEach((b,i)=>{b.classList.toggle('on',K[i]===k)});
const c=document.getElementById('cards');
const s=D[k];
c.innerHTML=s.p.map((p,i)=>'<div class="card" ontouchstart="hi(\''+k+'\','+i+')" ontouchend="lo()" onmouseenter="hi(\''+k+'\','+i+')" onmouseleave="lo()"><div class="card-head"><span class="badge" style="background:'+s.c+'">'+p.n+'</span><span class="card-title">'+p.t+'</span></div><div class="card-desc">'+p.d+'</div></div>').join('');
lo();
}
function hi(k,i){
document.querySelectorAll('.mg').forEach(g=>{
if(g.dataset.s===k&&parseInt(g.dataset.i)===i){g.classList.remove('dim');g.classList.add('glow');}
else{g.classList.add('dim');g.classList.remove('glow');}
});
}
function lo(){
document.querySelectorAll('.mg').forEach(g=>{
if(g.dataset.s===cur){g.classList.remove('dim');g.classList.remove('glow');}
else{g.classList.add('dim');g.classList.remove('glow');}
});
}
init();
</script>
